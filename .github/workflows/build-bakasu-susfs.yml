name: Build XAGA Kernel — BakaSU + SUSFS (GKI 5.10)

# Full delivery: BakaSU latest-CI kernel driver + official susfs4ksu kernel patch.
# Outputs: 64MiB boot.img + AnyKernel3 zip + modules + config + notes.
# Kernel name follows the user's V14.0.6.0 stock banner (5.10.136-...ab9585114).

on:
  workflow_dispatch:
    inputs:
      bakasu_ref:
        description: 'BakaSU kernel driver ref (main / commit)'
        required: false
        default: '252b15203940'
      enable_susfs:
        description: 'Integrate kernel-level SUSFS'
        type: boolean
        default: true
  push:
    branches: [ mglru ]
    paths:
      - 'scripts/build_bakasu.sh'
      - 'boot-bakasu/**'
      - '.github/workflows/build-bakasu-susfs.yml'

permissions:
  contents: read

concurrency:
  group: xaga-bakasu-susfs
  cancel-in-progress: false

env:
  BAKASU_REF_DEFAULT: 252b15203940

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout (includes vendored stock boot chunks)
        uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential libssl-dev libelf-dev \
            device-tree-compiler ccache curl wget git zip unzip p7zip-full \
            zstd lz4 xz-utils rsync ca-certificates python3

      - name: Verify stock boot chunks
        run: |
          cat boot-bakasu/boot.img.part-*.part > /tmp/stock-verify.img
          echo "8a818f319380a7bb2e432f8cf6eed2aaa0a7d5c1ac57cc2bbcf191b557b58faf  /tmp/stock-verify.img" | sha256sum -c -
          rm -f /tmp/stock-verify.img

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-xaga-bakasu-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-xaga-bakasu-${{ runner.os }}-

      - name: Build (BakaSU + SUSFS + boot.img + AK3)
        run: |
          chmod +x scripts/build_bakasu.sh
          BAKASU_REF="${{ inputs.bakasu_ref || env.BAKASU_REF_DEFAULT }}" \
          ENABLE_SUSFS="${{ inputs.enable_susfs && '1' || '1' }}" \
          JOBS=4 bash scripts/build_bakasu.sh

      - name: Verify SUSFS really present in boot kernel
        run: |
          python3 - <<'PY'
          import sys
          counts = {}
          for line in open('artifacts-bakasu/symbol-counts.txt'):
              if ':' in line:
                  k,v = line.split(':',1); counts[k.strip()] = int(v.strip())
          print('kernel symbol counts:', counts)
          susfs = counts.get('SUSFS strings', 0)
          ksu = counts.get('KernelSU strings', 0)
          if ksu < 10:
              print('ERROR: KernelSU not present in kernel', file=sys.stderr); sys.exit(1)
          if susfs < 5:
              print('ERROR: kernel-level SUSFS symbols missing (got %d)' % susfs, file=sys.stderr); sys.exit(1)
          print('OK: KernelSU + kernel-level SUSFS confirmed in compiled kernel.')
          PY

      - name: Upload delivery artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xaga-bakasu-susfs-${{ github.run_number }}
          path: |
            artifacts-bakasu/boot.img
            artifacts-bakasu/AnyKernel3-BakaSU-SUSFS-xaga.zip
            artifacts-bakasu/SHA256SUMS.txt
            artifacts-bakasu/kernel.config.txt
            artifacts-bakasu/kernel-source.txt
            artifacts-bakasu/bakasu-driver.txt
            artifacts-bakasu/kernel-banner.txt
            artifacts-bakasu/symbol-counts.txt
            artifacts-bakasu/susfs-hooked-files.txt
            artifacts-bakasu/build.log
          if-no-files-found: warn
          retention-days: 90

      - name: Job summary
        if: always()
        run: |
          echo "### XAGA BakaSU+SUSFS build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- BakaSU ref: ${{ inputs.bakasu_ref || env.BAKASU_REF_DEFAULT }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f artifacts-bakasu/symbol-counts.txt ]; then
            echo "- Symbols: $(tr '\n' ' ' < artifacts-bakasu/symbol-counts.txt)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f artifacts-bakasu/SHA256SUMS.txt ]; then
            echo "- Outputs:" >> "$GITHUB_STEP_SUMMARY"
            cat artifacts-bakasu/SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          fi
